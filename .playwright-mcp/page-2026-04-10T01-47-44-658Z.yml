            - heading "Sustainability Risk Policies (Article 3)" [level=1] [ref=e142]
          - article [ref=e143]:
            - paragraph [ref=e144]:
              - text: Article 3 of SFDR requires every financial market participant and financial adviser in scope to prominently publish and maintain on their website information about their
              - strong [ref=e145]: policies on the integration of sustainability risks
              - text: in their investment decision-making process (or investment advice process for advisers).
            - paragraph [ref=e146]: This is the foundational entity-level disclosure obligation. It strongly applies to every single firm in scope, regardless of whether any of their products are classified as Article 8 or Article 9.
            - paragraph [ref=e147]: "In plain English: every firm covered by SFDR must publicly explain exactly what it does (or actively does not do) when it comes to managing real ESG-related risks that could impact investment returns."
            - generic [ref=e150]:
              - generic [ref=e151]:
                - generic [ref=e152]:
                  - img [ref=e154]
                  - paragraph [ref=e158]: Listen to this lesson (podcast-style overview)
                - button "1x" [ref=e159] [cursor=pointer]
              - generic [ref=e160]:
                - button "Back 15s" [ref=e161] [cursor=pointer]:
